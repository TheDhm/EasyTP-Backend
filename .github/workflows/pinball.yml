name: Pinball CI/CD

on:
  push:
    branches: [main, develop]
    tags: ['v*']
    paths:
      - 'dockerfiles/pinball/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'dockerfiles/pinball/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set build tag
        id: build_tag
        run: echo "tag=$(date +'%Y%m%d-%H%M%S')-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ secrets.REGISTRY_URL }}/pinball
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.build_tag.outputs.tag }}
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./dockerfiles/pinball
          file: ./dockerfiles/pinball/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Pinball image tag in api
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          API_URL: ${{ vars.DJANGO_API_URL }}
          IMAGE_TAG: ${{ steps.build_tag.outputs.tag }}
        run: |
          # HMAC-SHA256 over "<timestamp>.<body>" (verified by UpdateAppImageView);
          # the secret itself never leaves the runner.
          body=$(jq -nc --arg tag "$IMAGE_TAG" '{app_name: "PINBALL", image_tag: $tag}')
          ts=$(date +%s)
          sig=$(printf '%s.%s' "$ts" "$body" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" -r | cut -d' ' -f1)
          curl --fail-with-body -sS -X POST "${API_URL}/webhook/update-image/" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Timestamp: ${ts}" \
            -H "X-Webhook-Signature: sha256=${sig}" \
            --data "$body"
