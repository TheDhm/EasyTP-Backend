[project]
name = "easytp-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.7",
    "django-cors-headers>=4.8.0",
    "django-filter>=25.1",
    "django-redis>=6.0.0",
    "djangorestframework>=3.16.1",
    "djangorestframework-simplejwt>=5.5.1",
    "gunicorn>=23.0.0",
    "kubernetes>=33.1.0",
    "openpyxl>=3.1.5",
    "psycopg2-binary>=2.9.11",
    "redis>=6.2.0",
    "requests>=2.33.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-django>=4.5.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "factory-boy>=3.3.0",
    "faker>=22.0.0",
    "responses>=0.25.0",
    "ruff>=0.4.0",
    "pre-commit>=4.0.0",
]

[project.scripts]
dev = "EasyTPCloud.cli:dev"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "EasyTPCloud.settings.test"
python_files = ["test_*.py"]
addopts = [
    "--strict-markers",
    "-ra",
    "--cov=api",
    "--cov=main",
    "--cov=shared",
    "--cov-report=term-missing",
]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pip-audit>=2.10.0",
    "pytest>=9.0.3",
]

[tool.setuptools.packages.find]
include = ["api*", "main*", "shared*", "EasyTPCloud*"]
exclude = ["tests*", "static*"]

[tool.coverage.run]
omit = [
    "tests/*",
    "*/migrations/*",
    "*/settings/*",
    "manage.py",
    "*/admin.py",
    "main/views.py",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"EasyTPCloud/settings/*.py" = ["F403", "F405"]
